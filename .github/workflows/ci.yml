name: CI

# Test + lint gate. Runs on every PR and on pushes to main.
# Linux for everything portable; one macOS leg for the Apple-only sidecar host that
# the Linux jobs `cfg` out entirely. Cross-platform bundling is verified later at
# release time, not here. Release automation is out of scope for this workflow.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Coloured cargo output everywhere; harmless for the non-Rust jobs.
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────── Rust ───────────────────────────
  # CI runs fmt + clippy (the Linux compile/lint canary — clippy --all-targets
  # also compiles the test code). The Rust test SUITE runs locally and is gated
  # by a `signoff` commit status (gh-signoff); see docs/ci.md.

  rust-fmt:
    name: Rust (fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # fmt needs only rustfmt from the pinned toolchain — no system deps, no
      # compile, no cache. Kept as its own tiny job for near-instant feedback.
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format check
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Gates clippy's compile on rustc warnings too. Scoped to this job so it
      # can't invalidate the frontend/e2e caches.
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The only Rust compile job now, so it writes the shared cache.
      - name: Set up Rust environment
        uses: ./.github/actions/rust-env
        with:
          save-cache: 'true'
          fetch-pdfium: 'true'
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The `qwen` sidecar host is `cfg`-gated to aarch64-apple-darwin, so the Linux
  # jobs above never compile it — including the workspace's only process-signalling
  # `unsafe` and the group-teardown tests that constrain it (#241). This leg is the
  # only automated coverage those get; scoped to `lenslm` to stay cheap.
  rust-macos-sidecar:
    name: Rust (macOS sidecar host)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      # `lance-encoding`'s build script needs protoc; the Linux jobs get it from
      # apt via the `rust-env` composite, which does not run here.
      - name: Install protoc
        run: brew install protobuf
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-macos
          save-if: 'true'
      - name: Fetch + verify pinned libpdfium dylib
        run: scripts/fetch-pdfium.sh --verify
      # SHA-pinned: this action downloads + executes a prebuilt nextest binary.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest
      - name: Clippy
        run: cargo clippy -p lenslm --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run -p lenslm

  # ───────────────────────── Frontend ─────────────────────────
  frontend:
    name: Frontend (format + check + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run format:check

      - name: Svelte type check
        run: bun run check

      - name: Unit + component tests
        run: bun run test

  e2e:
    # Non-blocking: Playwright drives the SvelteKit dev server (not native Tauri),
    # so a failure here is informative but does not gate merges.
    name: E2E (Playwright, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
